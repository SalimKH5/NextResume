name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the build only needs them to be defined.
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
